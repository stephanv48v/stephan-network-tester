<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Codeblue Network Test Studio</title>
  <link rel="icon" type="image/svg+xml" href="/static/brand/codeblue-mark.svg" />
  <link rel="stylesheet" href="/static/styles.css?v=5.2" />
  <style>
    html, body { background: var(--sidebar-bg, #142338); }
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .login-wrap { width: 100%; max-width: 380px; }
    .login-brand { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 20px; }
    .login-card { padding: 26px 26px 22px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35); }
    .login-title { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
    .login-sub { font-size: 12.5px; color: var(--text-secondary); margin-bottom: 18px; }
    .login-error { display: none; margin-bottom: 12px; padding: 9px 11px; font-size: 12.5px; border-radius: var(--radius-ctrl, 7px);
                   color: var(--critical, #DC2626); background: var(--critical-bg, #FEF2F2); border: 1px solid var(--critical-border, #FECACA); }
    .login-foot { margin-top: 14px; text-align: center; font-size: 11.5px; color: #94A3B8; }
    .login-hide { display: none; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-brand">
      <div class="logo-plate" style="padding:14px 22px;"><img src="/static/brand/codeblue-logo.svg" alt="codeblue IT services" style="width:230px;height:auto;display:block;" /></div>
    </div>
    <div style="text-align:center;color:#9FC9EE;font-size:12.5px;letter-spacing:0.05em;margin:10px 0 18px;">NETWORK TEST STUDIO</div>

    <form class="card login-card" id="loginForm" novalidate>
      <div class="login-title" id="loginTitle">Loading…</div>
      <div class="login-sub" id="loginSub"></div>
      <div class="login-error" id="loginError" role="alert"></div>

      <div class="form-group">
        <label class="form-label" for="pw">Password</label>
        <input type="password" class="form-control" id="pw" autocomplete="current-password" autofocus />
      </div>
      <div class="form-group login-hide" id="confirmGroup">
        <label class="form-label" for="pw2">Confirm password</label>
        <input type="password" class="form-control" id="pw2" autocomplete="new-password" />
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="loginBtn" disabled>Sign in</button>
    </form>
    <div class="login-foot">Forgot the password? Run <code>backend/auth.py --reset</code> on the server.</div>
  </div>

  <script>
    (function () {
      var mode = null; // 'setup' | 'login'
      var form = document.getElementById('loginForm');
      var pw = document.getElementById('pw');
      var pw2 = document.getElementById('pw2');
      var btn = document.getElementById('loginBtn');
      var errBox = document.getElementById('loginError');

      function showError(text) {
        errBox.textContent = text;
        errBox.style.display = text ? 'block' : 'none';
      }

      function setMode(m) {
        mode = m;
        var setup = m === 'setup';
        document.getElementById('loginTitle').textContent = setup ? 'Create admin password' : 'Sign in';
        document.getElementById('loginSub').textContent = setup
          ? 'No password is set yet. Choose one (at least 8 characters) to protect this appliance.'
          : 'Enter the admin password to continue.';
        document.getElementById('confirmGroup').classList.toggle('login-hide', !setup);
        pw.setAttribute('autocomplete', setup ? 'new-password' : 'current-password');
        btn.textContent = setup ? 'Create password' : 'Sign in';
        btn.disabled = false;
        pw.focus();
      }

      function post(path, body) {
        return fetch(path, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
          credentials: 'same-origin'
        }).then(function (res) {
          return res.json().catch(function () { return {}; }).then(function (data) {
            return { status: res.status, ok: res.ok, data: data };
          });
        });
      }

      function loadStatus() {
        fetch('/api/auth/status', { credentials: 'same-origin', cache: 'no-store' })
          .then(function (r) { return r.json(); })
          .then(function (s) {
            if (s.logged_in) { location.replace('/'); return; }
            setMode(s.password_set ? 'login' : 'setup');
          })
          .catch(function () {
            document.getElementById('loginTitle').textContent = 'Sign in';
            showError('Cannot reach the appliance. Refresh to try again.');
          });
      }

      form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        if (!mode) return;
        showError('');
        var p = pw.value;
        if (mode === 'setup') {
          if (p.length < 8) { showError('Password must be at least 8 characters.'); return; }
          if (p !== pw2.value) { showError('Passwords do not match.'); return; }
        } else if (!p) {
          showError('Enter the password.');
          return;
        }
        btn.disabled = true;
        post(mode === 'setup' ? '/api/auth/setup' : '/api/auth/login', { password: p })
          .then(function (r) {
            if (r.ok) { location.replace('/'); return; }
            var msg = (r.data && r.data.detail) || ('HTTP ' + r.status);
            if (typeof msg !== 'string') msg = 'Request failed (HTTP ' + r.status + ')';
            if (r.status === 401) msg = 'Wrong password.';
            showError(msg);
            if (r.status === 409) { loadStatus(); } // password state changed under us
            pw.value = '';
            pw.focus();
          })
          .catch(function () { showError('Cannot reach the appliance.'); })
          .then(function () { btn.disabled = false; });
      });

      loadStatus();
    })();
  </script>
</body>
</html>
