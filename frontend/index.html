  <style>
    body {
      background-color: #060911;
      color: #F8FAFC;
      background-image:
        radial-gradient(circle at 12% 10%, rgba(0, 229, 255, 0.07), transparent 28%),

    }
    .glass-card {
      background: rgba(13, 19, 34, 0.88);

    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #090D18; }

</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    function formatBps(bps) {
      if (!bps || bps <= 0) return { val: "0.00", unit: "Mbps", full: "0.00 Mbps" };
      if (bps >= 1e9) return { val: (bps / 1e9).toFixed(2), unit: "Gbps", full: `${(bps / 1e9).toFixed(2)} Gbps` };
      if (bps >= 1e6) return { val: (bps / 1e6).toFixed(1), unit: "Mbps", full: `${(bps / 1e6).toFixed(1)} Mbps` };
      if (bps >= 1e3) return { val: (bps / 1e3).toFixed(1), unit: "Kbps", full: `${(bps / 1e3).toFixed(1)} Kbps` };
      return { val: bps.toFixed(0), unit: "bps", full: `${bps.toFixed(0)} bps` };
    }

    function formatPps(pps) {
      if (!pps || pps <= 0) return { val: "0.0", unit: "kpps", full: "0 kpps" };
      if (pps >= 1e6) return { val: (pps / 1e6).toFixed(2), unit: "Mpps", full: `${(pps / 1e6).toFixed(2)} Mpps` };
      if (pps >= 1e3) return { val: (pps / 1e3).toFixed(1), unit: "kpps", full: `${(pps / 1e3).toFixed(1)} kpps` };
      return { val: pps.toFixed(0), unit: "pps", full: `${pps.toFixed(0)} pps` };
    }

    const TRAFFIC_TYPES_META = [
      { key: "web_https", label: "Web & Cloud SaaS", sub: "HTTP/2, TLS 1.3, REST APIs", color: "#00E5FF", icon: "🌐" },
      { key: "video_streaming", label: "4K Video & CCTV", sub: "RTSP Cameras, HLS, RTP Video", color: "#10B981", icon: "📹" },
      { key: "voip_rtp", label: "VoIP & Teams/Zoom", sub: "SIP + G.711 RTP (DSCP EF 46)", color: "#F59E0B", icon: "📞" },
      { key: "file_smb", label: "SMB / SAN / Backups", sub: "1518B-9000B Elephant Flows", color: "#8B5CF6", icon: "💾" },
      { key: "dns_control", label: "DNS / DHCP / ARP", sub: "Control-Plane & Lookups", color: "#EC4899", icon: "🧭" },
      { key: "gaming_udp", label: "Real-Time Gaming UDP", sub: "High Tick-Rate Low-Latency", color: "#38BDF8", icon: "🎮" },
    ];

    /* Custom Branded SVG Logo for Stephan Van Vuuren's Network Tester */
    function BrandLogoSVG() {
      return (
        <svg viewBox="0 0 56 56" className="w-12 h-12 flex-shrink-0">
          <defs>
            <linearGradient id="svvGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stopColor="#00E5FF" />
              <stop offset="50%" stopColor="#3B82F6" />
              <stop offset="100%" stopColor="#10B981" />
            </linearGradient>
          </defs>
          <polygon points="28,3 51,16 51,40 28,53 5,40 5,16" fill="#0B1325" stroke="url(#svvGrad)" strokeWidth="2.5" />
          <path d="M14 34 L22 22 L29 30 L40 16" fill="none" stroke="#00E5FF" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" />
          <circle cx="14" cy="34" r="3" fill="#00E5FF" />
          <circle cx="22" cy="22" r="3" fill="#3B82F6" />
          <circle cx="29" cy="30" r="3" fill="#10B981" />
          <circle cx="40" cy="16" r="3.5" fill="#F59E0B" />
          <text x="28" y="45" textAnchor="middle" fill="#E2E8F0" fontSize="8.5" fontWeight="800" fontFamily="JetBrains Mono">SVV-10G</text>
        </svg>

    }

    /* Interactive Animated Network Topology & Dell PowerEdge R640 SVG Visualizer */
    function AnimatedNetworkTopologySVG({ telemetry, simulatedUsers, simulatedDevices, protocolMix, onSelectNic }) {
      const running = Boolean(telemetry?.running);
      const ratePct = telemetry?.rate_pct || 0;
      const txFormatted = formatBps(telemetry?.tx_bps || 0);
      const ppsFormatted = formatPps(telemetry?.tx_pps || 0);
      const dropPct = telemetry?.drop_pct || 0;
      const interfaces = telemetry?.interfaces || [];
      const physNics = interfaces.filter(i => i.pci_address !== 'virtual');

      return (
        <div className="glass-card rounded-2xl p-4 border border-slate-800">
          <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
            <div className="flex items-center gap-2">
              <span className={`w-2.5 h-2.5 rounded-full ${running ? 'bg-emerald-400 led-blink' : 'bg-cyan-400'}`}></span>
              <h3 className="text-xs font-bold uppercase tracking-wider text-slate-300">
                Live Hardware & Virtual Traffic Topology — Dell PowerEdge R640 (1x 10GbE + 4x 1GbE)
              </h3>
            </div>
            <div className="flex items-center gap-4 text-xs font-mono text-slate-400">
              <span>Users: <strong className="text-cyan-400">{simulatedUsers.toLocaleString()}</strong></span>
              <span>Devices: <strong className="text-emerald-400">{simulatedDevices.toLocaleString()}</strong></span>
              <span>Frame Size: <strong className="text-amber-400">{telemetry?.frame_size || 354} B</strong></span>
              <span>Link Target: <strong className="text-purple-400">{(telemetry?.link_capacity_mbps || 10000) >= 1000 ? `${(telemetry?.link_capacity_mbps || 10000)/1000} Gbps` : `${telemetry?.link_capacity_mbps} Mbps`}</strong></span>
            </div>
          </div>

          <svg viewBox="0 0 1050 225" className="w-full h-auto select-none">
            <defs>
              <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stopColor="#00E5FF" stopOpacity="0.85" />
                <stop offset="50%" stopColor="#10B981" stopOpacity="0.9" />
                <stop offset="100%" stopColor={dropPct > 0.5 ? "#F43F5E" : "#8B5CF6"} stopOpacity="0.9" />
              </linearGradient>
              <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="3" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
              </filter>
            </defs>

            {/* LEFT NODE: Virtual Users & Devices Pool */}
            <rect x="12" y="18" width="235" height="188" rx="14" fill="#0B1120" stroke="#1E293B" strokeWidth="2" />
            <text x="28" y="42" fill="#00E5FF" fontSize="11" fontWeight="700" fontFamily="Inter">SIMULATED USERS & DEVICES</text>

            {/* User & Device SVG Icons & Counts */}
            <g transform="translate(28, 56)">
              <rect x="0" y="0" width="96" height="54" rx="8" fill="#111827" stroke="#00E5FF" strokeOpacity="0.4" />
              <text x="12" y="21" fill="#94A3B8" fontSize="9.5" fontWeight="600">VIRTUAL USERS</text>
              <text x="12" y="42" fill="#F8FAFC" fontSize="15" fontWeight="800" fontFamily="JetBrains Mono">{simulatedUsers.toLocaleString()}</text>

              <rect x="106" y="0" width="98" height="54" rx="8" fill="#111827" stroke="#10B981" strokeOpacity="0.4" />
              <text x="116" y="21" fill="#94A3B8" fontSize="9.5" fontWeight="600">ENDPOINTS / MACs</text>
              <text x="116" y="42" fill="#10B981" fontSize="15" fontWeight="800" fontFamily="JetBrains Mono">{simulatedDevices.toLocaleString()}</text>
            </g>

            {/* Mini Traffic Mix Bars inside Left Node */}
            <g transform="translate(28, 122)">
              <text x="0" y="10" fill="#64748B" fontSize="9" fontWeight="700">ACTIVE APPLICATION STREAMS</text>
              {TRAFFIC_TYPES_META.slice(0, 4).map((t, idx) => {
                const pct = Math.round(protocolMix?.[t.key] ?? 20);
                return (
                  <g key={t.key} transform={`translate(0, ${18 + idx * 14})`}>
                    <text x="0" y="9" fill="#CBD5E1" fontSize="8.5" fontFamily="Inter">{t.label.split(' ')[0]}</text>
                    <rect x="58" y="2" width="115" height="6" rx="3" fill="#1E293B" />
                    <rect x="58" y="2" width={Math.max(3, (pct / 100) * 115)} height="6" rx="3" fill={t.color} />
                    <text x="180" y="9" fill="#94A3B8" fontSize="8.5" fontFamily="JetBrains Mono">{pct}%</text>
                  </g>
                );
              })}
            </g>

            {/* ANIMATED PIPE 1: Users Pool -> R640 TRex Engine */}
            <line x1="247" y1="112" x2="345" y2="112" stroke="#1E293B" strokeWidth="10" strokeLinecap="round" />
            <line
              x1="247" y1="112" x2="345" y2="112"
              stroke="url(#pipeGrad)"
              strokeWidth={running ? Math.max(3, Math.min(9, (ratePct / 100) * 9)) : 2}
              className={running ? "svg-flow-line" : ""}
            />
            <text x="296" y="96" textAnchor="middle" fill="#00E5FF" fontSize="9.5" fontWeight="700" fontFamily="JetBrains Mono">
              {running ? `${ratePct.toFixed(0)}% LOAD` : "STANDBY"}
            </text>

            {/* CENTER NODE: Dell PowerEdge R640 Rear-Panel Bezel & NIC Ports */}
            <rect x="345" y="14" width="385" height="196" rx="14" fill="#0D1527" stroke="#334155" strokeWidth="2" />
            <rect x="357" y="24" width="361" height="26" rx="6" fill="#111C35" />
            <text x="369" y="41" fill="#F8FAFC" fontSize="11" fontWeight="800" fontFamily="Inter">
              DELL POWEREDGE R640 — REAR NIC BAY
            </text>
            <text x="706" y="41" textAnchor="end" fill="#10B981" fontSize="9.5" fontWeight="700" fontFamily="JetBrains Mono">
              {telemetry?.trex_connected ? "TREX ZMQ ONLINE" : "TREX READY"}
            </text>

            {/* Render the 5 Physical NIC Ports as realistic RJ45 / 10GbE Server Jacks */}
            {(physNics.length > 0 ? physNics : [
              { ifname: 'enp216s0', max_speed_mbps: 10000, operstate: 'UP', speed_mbps: 100, is_management: true, ipv4: ['10.20.30.237/24'] },
              { ifname: 'eno1', max_speed_mbps: 1000, operstate: 'DOWN', speed_mbps: 0 },
              { ifname: 'eno2', max_speed_mbps: 1000, operstate: 'DOWN', speed_mbps: 0 },
              { ifname: 'eno3', max_speed_mbps: 1000, operstate: 'DOWN', speed_mbps: 0 },
              { ifname: 'eno4', max_speed_mbps: 1000, operstate: 'DOWN', speed_mbps: 0 },
            ]).slice(0, 5).map((nic, idx) => {
              const xPos = 362 + idx * 71;
              const isUp = nic.operstate === 'UP' || nic.link_detected;
              const is10G = (nic.max_speed_mbps || 0) >= 10000;
              const ledColor = isUp ? (running ? "#00E5FF" : "#10B981") : "#EF4444";
              return (
                <g
                  key={nic.ifname}
                  transform={`translate(${xPos}, 60)`}
                  className="cursor-pointer"
                  onClick={() => onSelectNic && onSelectNic(nic)}
                >
                  <rect
                    x="0" y="0" width="64" height="84" rx="8"
                    fill={is10G ? "#131F3A" : "#0F172A"}
                    stroke={isUp ? (is10G ? "#00E5FF" : "#10B981") : "#334155"}
                    strokeWidth={is10G ? "2" : "1.5"}
                  />
                  {/* Port LEDs */}
                  <circle cx="14" cy="13" r="4" fill={ledColor} className={isUp && running ? "led-blink" : ""} />
                  <circle cx="50" cy="13" r="3.5" fill={is10G ? "#F59E0B" : "#64748B"} />
                  {/* RJ45 Metallic Cutout */}
                  <rect x="13" y="23" width="38" height="26" rx="3" fill="#060911" stroke="#475569" strokeWidth="1.2" />
                  <line x1="21" y1="24" x2="21" y2="33" stroke="#F59E0B" strokeWidth="1.5" />
                  <line x1="27" y1="24" x2="27" y2="33" stroke="#F59E0B" strokeWidth="1.5" />
                  <line x1="33" y1="24" x2="33" y2="33" stroke="#F59E0B" strokeWidth="1.5" />
                  <line x1="39" y1="24" x2="39" y2="33" stroke="#F59E0B" strokeWidth="1.5" />
                  <line x1="45" y1="24" x2="45" y2="33" stroke="#F59E0B" strokeWidth="1.5" />

                  <text x="32" y="62" textAnchor="middle" fill="#F8FAFC" fontSize="9.5" fontWeight="700" fontFamily="JetBrains Mono">
                    {nic.ifname}
                  </text>
                  <text x="32" y="75" textAnchor="middle" fill={is10G ? "#00E5FF" : "#94A3B8"} fontSize="8" fontWeight="700">
                    {is10G ? "10GbE NIC" : "1GbE I350"}
                  </text>
                </g>
              );
            })}

            {/* Bottom bar inside R640 Node showing CPU / RAM / HugePages */}
            <rect x="362" y="154" width="353" height="42" rx="8" fill="#090E1A" stroke="#1E293B" />
            <text x="376" y="172" fill="#94A3B8" fontSize="9.5" fontFamily="JetBrains Mono">
              CPU: <tspan fill="#00E5FF" fontWeight="700">{telemetry?.cpu_pct ?? 0}%</tspan> (32T Xeon)
            </text>
            <text x="515" y="172" fill="#94A3B8" fontSize="9.5" fontFamily="JetBrains Mono">
              RAM: <tspan fill="#10B981" fontWeight="700">{telemetry?.ram_used_gb ?? 3.5} / {telemetry?.ram_total_gb ?? 499} GB</tspan>
            </text>
            <text x="376" y="188" fill="#64748B" fontSize="8.5" fontFamily="JetBrains Mono">
              DHCP MGMT: {telemetry?.management_interface || 'enp216s0'} (10.20.30.237) • Protected from DPDK Unbind
            </text>

            {/* ANIMATED PIPE 2: R640 -> Switch / Network Under Test */}
            <line x1="730" y1="112" x2="828" y2="112" stroke="#1E293B" strokeWidth="12" strokeLinecap="round" />
            <line
              x1="730" y1="112" x2="828" y2="112"
              stroke="url(#pipeGrad)"
              strokeWidth={running ? Math.max(4, Math.min(10, (ratePct / 100) * 10)) : 2}
              className={running ? "svg-flow-line" : ""}
            />
            <text x="779" y="92" textAnchor="middle" fill="#10B981" fontSize="10" fontWeight="800" fontFamily="JetBrains Mono">
              {txFormatted.full}
            </text>
            <text x="779" y="136" textAnchor="middle" fill="#94A3B8" fontSize="9" fontFamily="JetBrains Mono">
              {ppsFormatted.full}
            </text>

            {/* RIGHT NODE: Target Network / Switch / Firewall Under Test */}
            <rect x="828" y="18" width="210" height="188" rx="14" fill="#0B1120" stroke={dropPct > 1.0 ? "#F43F5E" : "#1E293B"} strokeWidth="2" />
            <text x="844" y="42" fill="#F8FAFC" fontSize="11" fontWeight="700">NETWORK UNDER TEST</text>

            <g transform="translate(844, 54)">
              <rect x="0" y="0" width="178" height="42" rx="7" fill="#111827" />
              <text x="10" y="16" fill="#94A3B8" fontSize="9">END-TO-END LATENCY / JITTER</text>
              <text x="10" y="34" fill="#F59E0B" fontSize="13.5" fontWeight="800" fontFamily="JetBrains Mono">
                {(telemetry?.lat_avg_us || 0).toFixed(1)} us <tspan fill="#A855F7" fontSize="11">±{(telemetry?.jitter_us || 0).toFixed(1)} us</tspan>
              </text>

              <rect x="0" y="49" width="178" height="42" rx="7" fill="#111827" />
              <text x="10" y="65" fill="#94A3B8" fontSize="9">PACKET LOSS / DROPS</text>
              <text x="10" y="83" fill={dropPct > 0.5 ? "#F43F5E" : "#10B981"} fontSize="13.5" fontWeight="800" fontFamily="JetBrains Mono">
                {dropPct.toFixed(3)}% ({(telemetry?.dropped_packets || 0).toLocaleString()})
              </text>

              <rect x="0" y="98" width="178" height="42" rx="7" fill="#111827" />
              <text x="10" y="114" fill="#94A3B8" fontSize="9">VOIP CALL QUALITY (MOS)</text>
              <text x="10" y="132" fill="#00E5FF" fontSize="13.5" fontWeight="800" fontFamily="JetBrains Mono">
                {(telemetry?.mos_score || 4.45).toFixed(2)} / 4.50 <tspan fill="#10B981" fontSize="10">{(telemetry?.mos_score || 4.45) >= 4.0 ? "HD VOICE" : "DEGRADED"}</tspan>
              </text>
            </g>
          </svg>
        </div>
      );
    }

    /* Main Application Component */
    function App() {
      const [activeTab, setActiveTab] = useState("cockpit");
      const [telemetry, setTelemetry] = useState(null);
      const [wsConnected, setWsConnected] = useState(false);
      const [profiles, setProfiles] = useState([]);
      const [scalePresets, setScalePresets] = useState([]);
      const [runs, setRuns] = useState([]);
      const [schedules, setSchedules] = useState([]);
      const [hardware, setHardware] = useState(null);

      // Selected Test Configuration State
      const [selectedProfileId, setSelectedProfileId] = useState("imix");
      const [testMode, setTestMode] = useState("continuous"); // continuous | timed | step_ramp
      const [durationSec, setDurationSec] = useState(60);
      const [ratePct, setRatePct] = useState(35);
      const [simulatedUsers, setSimulatedUsers] = useState(500);
      const [simulatedDevices, setSimulatedDevices] = useState(1250);
      const [linkCapacityMbps, setLinkCapacityMbps] = useState(10000);
      const [protocolMix, setProtocolMix] = useState({
        web_https: 40,
        video_streaming: 25,
        voip_rtp: 15,
        file_smb: 10,
        dns_control: 5,
        gaming_udp: 5,
      });

      // Custom Packet Builder & Step-Ramp Config
      const [customConfig, setCustomConfig] = useState({
        frame_size: 512,
        vlan_id: 0,
        dscp: 46,
        protocol: "UDP",
        src_ip_start: "10.100.0.1",
        src_ip_end: "10.100.31.254",
        dst_ip_start: "10.200.0.1",
        dst_ip_end: "10.200.15.254",
        src_mac: "02:53:56:00:00:01",
        dst_mac: "02:53:56:00:00:02",
        target_ip: "",
        target_port: 5060,
        ramp_start_pct: 10,
        ramp_step_pct: 15,
        ramp_step_sec: 5,
        ramp_max_pct: 100,
      });

      // Diagnostics & RFC 2544 State
      const [rfcResult, setRfcResult] = useState(null);
      const [rfcLoading, setRfcLoading] = useState(false);
      const [mtuResult, setMtuResult] = useState(null);
      const [dnsGwResult, setDnsGwResult] = useState(null);
      const [iperfResult, setIperfResult] = useState(null);
      const [diagTargetIp, setDiagTargetIp] = useState("10.20.30.1");
      const [diagLoading, setDiagLoading] = useState(false);

      // New Schedule Form
      const [newJob, setNewJob] = useState({
        name: "Overnight Campus Link Stress Test",
        cron_expr: "0 2 * * *",
        profile_id: "imix",
        test_mode: "timed",
        duration_sec: 120,
        rate_pct: 60,
        simulated_users: 1000,
        simulated_devices: 2500,
      });

      // Appliance Settings State
      const [settings, setSettings] = useState({
        appliance_name: "Stephan Van Vuuren's Network Tester",
        site_label: "Portable Dell R640 DHCP Appliance",
        default_link_capacity_mbps: 10000,
        safety_watchdog_enabled: true,
        safety_max_drop_pct: 15.0,
        protect_mgmt_nic: true,
        lcd_ip_display: true,
        mdns_hostname: "stephan-tester.local",
      });
      const [toast, setToast] = useState(null);

      // ECharts instances and rolling 60-sample buffers
      const tpChartRef = useRef(null);
      const latChartRef = useRef(null);
      const tpChartInstance = useRef(null);
      const latChartInstance = useRef(null);
      const historyRef = useRef({
        labels: [],
        txMbps: [],
        rxMbps: [],
        txKpps: [],
        latAvg: [],
        latMax: [],
        jitter: [],
        drops: [],
      });

      function showToast(msg, type = "info") {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 4000);
      }

      async function fetchInitialData() {
        try {
          const [profRes, runsRes, schedRes, hwRes, setRes] = await Promise.all([
            fetch("/api/profiles").then(r => r.json()),
            fetch("/api/runs").then(r => r.json()),
            fetch("/api/schedules").then(r => r.json()),

      useEffect(() => {

          const proto = window.location.protocol === "https:" ? "wss:" : "ws:";
          ws = new WebSocket(`${proto}//${window.location.host}/ws/telemetry`);
          ws.onopen = () => setWsConnected(true);
          ws.onclose = () => {
            setWsConnected(false);
            retryTimer = setTimeout(connectWs, 1500);
          };
          ws.onmessage = (evt) => {
            try {
              const data = JSON.parse(evt.data);
              setTelemetry(data);
              if (data.running && typeof data.rate_pct === "number") {
                setRatePct(data.rate_pct);
              }

              // Push to rolling 60-point chart history
              const h = historyRef.current;
              const nowLabel = new Date().toLocaleTimeString([], { hour12: false, minute: "2-digit", second: "2-digit" });
              h.labels.push(nowLabel);
              h.txMbps.push(Number(((data.tx_bps || 0) / 1e6).toFixed(2)));
              h.rxMbps.push(Number(((data.rx_bps || 0) / 1e6).toFixed(2)));
              h.txKpps.push(Number(((data.tx_pps || 0) / 1e3).toFixed(2)));
              h.latAvg.push(Number((data.lat_avg_us || 0).toFixed(1)));
              h.latMax.push(Number((data.lat_max_us || 0).toFixed(1)));
              h.jitter.push(Number((data.jitter_us || 0).toFixed(1)));
              h.drops.push(Number((data.drop_pct || 0).toFixed(3)));

              if (h.labels.length > 60) {
                h.labels.shift();
                h.txMbps.shift();
                h.rxMbps.shift();
                h.txKpps.shift();
                h.latAvg.shift();
                h.latMax.shift();
                h.jitter.shift();
                h.drops.shift();
              }

              if (tpChartInstance.current) {
                tpChartInstance.current.setOption({
                  xAxis: { data: h.labels },
                  series: [
                    { data: h.txMbps },
                    { data: h.rxMbps },
                    { data: h.txKpps },
                  ],
                });

              if (latChartInstance.current) {
                latChartInstance.current.setOption({
                  xAxis: { data: h.labels },
                  series: [
                    { data: h.latAvg },
                    { data: h.jitter },
                    { data: h.drops },
                  ],
                });
              }
            } catch (e) {}
          };

        connectWs();
        return () => {
          clearTimeout(retryTimer);
          if (ws) ws.close();

                          type="checkbox"
                          checked={settings.protect_mgmt_nic}
                          onChange={e => setSettings({ ...settings, protect_mgmt_nic: e.target.checked })}
                        />
                        <span><strong>Management NIC Lockout Shield:</strong> Never allow DPDK to unbind the active DHCP Web UI interface</span>
                      </label>
                      <label className="flex items-center gap-2.5 text-xs text-slate-200 cursor-pointer">
                        <input
                          type="checkbox"
                          checked={settings.lcd_ip_display}
                          onChange={e => setSettings({ ...settings, lcd_ip_display: e.target.checked })}
                        />
                        <span><strong>Dell R640 Front LCD IP Display:</strong> Push live DHCP IP address to server front LCD panel on boot</span>
                      </label>
                      <label className="flex items-center gap-2.5 text-xs text-slate-200 cursor-pointer">
                        <input
                          type="checkbox"
                          checked={settings.safety_watchdog_enabled}
                          onChange={e => setSettings({ ...settings, safety_watchdog_enabled: e.target.checked })}
                        />
                        <span><strong>Safety Dead-Man Watchdog:</strong> Auto-throttle if frame loss exceeds {settings.safety_max_drop_pct}%</span>
                      </label>
                    </div>

                    <button
                      onClick={async () => {
                        await fetch("/api/config/settings", {
                          method: "POST",
                          headers: { "Content-Type": "application/json" },
                          body: JSON.stringify(settings),
                        });
                        showToast("Appliance configuration saved to SQLite!", "success");
                      }}
                      className="w-full py-2.5 rounded-xl bg-emerald-500 text-slate-950 font-extrabold text-xs uppercase tracking-wider"
                    >
                      💾 Save Appliance Configuration
                    </button>
                  </div>

                  {/* Right 6 Cols: /etc/trex_cfg.yaml Generator & HugePages Status */}
                  <div className="lg:col-span-6 glass-card rounded-2xl p-5 space-y-3">
                    <div className="flex items-center justify-between">
                      <h3 className="text-base font-extrabold text-white">🦖 Cisco TRex `/etc/trex_cfg.yaml` & HugePages</h3>
                      <button
                        onClick={async () => {
                          const res = await fetch("/api/config/trex", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ mode: "auto", restart_service: true }),
                          }).then(r => r.json());
                          const hw = await fetch("/api/hardware").then(r => r.json());
                          setHardware(hw);
                          showToast(`Regenerated /etc/trex_cfg.yaml (${res.selected_mode}) & restarted TRex daemon!`, "success");
                        }}
                        className="px-3 py-1.5 rounded-lg bg-cyan-500 text-slate-950 font-bold text-xs"
                      >
                        ⚡ Auto-Generate & Restart TRex
                      </button>
                    </div>

                    <pre className="p-3 rounded-xl bg-slate-950 border border-slate-800 text-[11px] font-mono text-cyan-300 overflow-x-auto max-h-56">
                      {hardware?.trex_cfg_yaml || "# Loading /etc/trex_cfg.yaml..."}
                    </pre>
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
